def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.reactnativeliveactivity"
    compileSdkVersion safeExtGet('compileSdkVersion', safeExtGet('compileSdk', 35))

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', safeExtGet('minSdk', 24))
        targetSdkVersion safeExtGet('targetSdkVersion', safeExtGet('targetSdk', 35))
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Resolve react-android safely according to consumer project
    if (findProject(':ReactAndroid') != null) {
        implementation project(':ReactAndroid')
    } else {
        implementation 'com.facebook.react:react-android'
    }

    def kotlinVersion = safeExtGet('kotlinVersion', safeExtGet('kotlin_version', '2.1.20'))
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation 'androidx.core:core-ktx:1.12.0'
}
