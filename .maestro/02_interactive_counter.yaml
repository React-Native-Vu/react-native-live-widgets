appId: com.livewidgetsexample
---
# Flow 2: 2-Way Interactive Counter Widget State Sync
- launchApp:
    clearState: false

- assertVisible: "REACT NATIVE LIVE WIDGETS"

# 1. Bấm nút +1 (Cộng)
- scrollUntilVisible:
    element:
      text: ".*\\+1.*"
    direction: DOWN
    timeout: 15000

- tapOn:
    text: ".*\\+1.*"

# 2. Bấm nút +1 lần nữa
- tapOn:
    text: ".*\\+1.*"

# 3. Bấm nút -1 (Trừ)
- tapOn:
    text: ".*-1.*"

# 4. Bấm nút Reset (0)
- tapOn:
    text: ".*Reset.*"

# 5. Thoát ra màn hình Home kiểm tra widget
- pressKey: Home

# 6. Mở lại app
- launchApp:
    stopApp: false
