appId: com.livewidgetsexample
---
# Flow 1: Live Activity & Dynamic Island Lifecycle E2E Test
- launchApp:
    clearState: false

- assertVisible: "REACT NATIVE LIVE WIDGETS"

# Cuộn tìm và bấm nút bật/đổi Live Activity trên thẻ Preset
- scrollUntilVisible:
    element:
      text: ".*(Bật|Đổi) Live Activity.*"
    direction: DOWN
    timeout: 30000
    speed: 60
    visibilityPercentage: 40

- tapOn:
    text: ".*(Bật|Đổi) Live Activity.*"

# Ra màn hình Home để kiểm tra Dynamic Island / Lock Screen
- pressKey: Home

# Vuốt thanh thông báo / Notification Center xuống để kiểm tra Live Activity
- swipe:
    direction: DOWN

# Quay lại App LiveWidgetsExample mà không làm mất in-memory state
- launchApp:
    stopApp: false

# Cuộn xuống nút kết thúc Live Activity
- scrollUntilVisible:
    element:
      text: ".*(Kết thúc|DANH SÁCH).*"
    direction: DOWN
    timeout: 15000
    speed: 60
    visibilityPercentage: 40

- tapOn:
    text: ".*Kết thúc.*"
    optional: true
