appId: com.livewidgetsexample
---
# Flow 1: Live Activity & Dynamic Island Lifecycle E2E Test
- launchApp:
    clearState: false

- assertVisible: "REACT NATIVE LIVE WIDGETS"

# Cuộn tìm và bấm nút "Bật Live Activity" trên thẻ preset đầu tiên
- scrollUntilVisible:
    element: "Bật Live Activity"
    direction: DOWN

- tapOn: "Bật Live Activity"

# Ra màn hình Home để kiểm tra Dynamic Island / Lock Screen
- pressHome

# Vuốt thanh thông báo / Notification Center xuống để kiểm tra Live Activity
- swipe:
    start: 50%, 0%
    end: 50%, 60%

# Quay lại App LiveWidgetsExample
- launchApp

# Cuộn xuống nút kết thúc Live Activity
- scrollUntilVisible:
    element: "Kết thúc Live Activity đang chạy"
    direction: DOWN

- tapOn: "Kết thúc Live Activity đang chạy"
