appId: com.livewidgetsexample
---
# Flow 2: 2-Way Interactive Home Screen Widget Click Test
- launchApp:
    clearState: false

- assertVisible: "REACT NATIVE LIVE WIDGETS"

# Cuộn tìm và bấm "Cập nhật Widget"
- scrollUntilVisible:
    element: "Cập nhật Widget"
    direction: DOWN

- tapOn: "Cập nhật Widget"

# Trở về màn hình chính Home Screen để hiển thị Widget
- pressHome
