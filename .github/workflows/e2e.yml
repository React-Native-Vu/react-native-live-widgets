name: E2E Maestro Tests

on:
  workflow_dispatch:
    inputs:
      flow:
        description: 'Flow to execute (e.g., full_suite, 01_live_activity, 02_interactive)'
        required: true
        default: 'full_suite'
        type: choice
        options:
          - full_suite
          - 01_live_activity_lifecycle
          - 02_interactive_counter
          - 03_data_binding_and_api_sync
          - 04_timeline_and_auto_cycle
          - 05_system_permissions_and_tokens
          - 06_control_widget_and_lifecycle_suite
          - 07_preset_switching_gallery
  schedule:
    # Run nightly at 02:00 UTC (9:00 AM VN)
    - cron: '0 2 * * *'
  push:
    tags:
      - 'v*'

jobs:
  e2e-android:
    name: Android E2E (Maestro on Emulator API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Build Library
        run: |
          npm ci || npm install
          npm run build

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Verify Maestro Installation
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro Tests on Android Emulator
        uses: reactive-circus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            export PATH="$HOME/.maestro/bin:$PATH"
            echo "Device booted successfully. Running Maestro test..."
            TARGET_FLOW="${{ github.event.inputs.flow || 'full_suite' }}"
            if [ "$TARGET_FLOW" = "full_suite" ]; then
              maestro test .maestro/full_suite.yaml || true
            else
              maestro test .maestro/${TARGET_FLOW}.yaml || true
            fi

      - name: Upload Maestro Test Artifacts & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-artifacts
          path: ~/.maestro/tests/
          retention-days: 7

  e2e-ios:
    name: iOS E2E (Maestro on Simulator)
    runs-on: macos-13
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies & Build Library
        run: |
          npm ci || npm install
          npm run build

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Boot iOS Simulator
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version
          DEVICE_UUID=$(xcrun simctl list devices available | grep -E "iPhone (14|15|16)" | head -n 1 | grep -E -o "([0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12})")
          echo "Selected Device UUID: $DEVICE_UUID"
          if [ -n "$DEVICE_UUID" ]; then
            xcrun simctl boot "$DEVICE_UUID" || true
          fi

      - name: Run Maestro Tests on iOS Simulator
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          TARGET_FLOW="${{ github.event.inputs.flow || 'full_suite' }}"
          if [ "$TARGET_FLOW" = "full_suite" ]; then
            maestro test .maestro/full_suite.yaml || true
          else
            maestro test .maestro/${TARGET_FLOW}.yaml || true
          fi

      - name: Upload Maestro Test Artifacts & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-artifacts
          path: ~/.maestro/tests/
          retention-days: 7
