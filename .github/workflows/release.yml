name: Release & Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version or bump type (patch | minor | major | X.Y.Z)"
        required: false
        default: "patch"

jobs:
  release:
    name: Build, Create GitHub Release & Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install TypeScript compiler
        run: npm install --no-save typescript

      - name: Compile TypeScript -> JavaScript + Type Definitions (.d.ts)
        run: npm run build

      - name: Verify Package Tarball
        run: npm pack --dry-run

      - name: Publish to npm Registry (if new version)
        id: publish_npm
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current package version: $CURRENT_VERSION"
          if npm view react-native-live-widgets@$CURRENT_VERSION version > /dev/null 2>&1; then
            echo "ℹ️ Version $CURRENT_VERSION is already published on npm. Skipping publish."
            echo "published=false" >> $GITHUB_OUTPUT
          else
            echo "🚀 New version detected! Publishing version $CURRENT_VERSION to npm..."
            npm publish --access public
            echo "published=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.publish_npm.outputs.published == 'true' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.publish_npm.outputs.version }}
          name: v${{ steps.publish_npm.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
