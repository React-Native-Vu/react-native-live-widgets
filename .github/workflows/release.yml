name: Release & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version or bump type (patch | minor | major | X.Y.Z)'
        required: false
        default: 'patch'

jobs:
  release:
    name: Build, Create GitHub Release & Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install TypeScript compiler
        run: npm install --no-save typescript

      - name: Compile TypeScript -> JavaScript + Type Definitions (.d.ts)
        run: npm run build

      - name: Verify Package Tarball
        run: npm pack --dry-run

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Publish to npm Registry
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

